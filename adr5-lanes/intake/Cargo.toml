[package]
name = "michelangelo_asset_intake"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ADR 0005 Asset Intake / Preservation PoC (provisional, standalone)"

# Standalone crate: deliberately NOT a member of the repository root workspace
# (root Cargo.toml must not change in this stream). The empty [workspace] table
# below detaches this package from the parent workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
michelangelo_input = { path = "../../crates/michelangelo_input" }

[dev-dependencies]
tempfile = "3"
