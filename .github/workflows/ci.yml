name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Ubuntu — Rust checks, Python worker checks, fake Blender smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Real-Blender tests auto-skip on runners without a Blender installation.
      - name: Run tests
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build -p michelangelo_cli

      - name: Python worker syntax check
        run: python3 -m py_compile blender/worker.py scripts/test_worker_validation.py scripts/smoke_blender_scene.py

      - name: Python worker validation tests (no bpy)
        run: python3 scripts/test_worker_validation.py

      # Deterministic acceptance E2E through JSONL: generated fake Blender, all
      # protocol/event/identity/artifact checks (pixel assertions are real-mode only).
      - name: Acceptance smoke — fake Blender
        run: python3 scripts/smoke_blender_scene.py --fake

      - name: Smoke — system.ping
        run: |
          printf '{"id":"1","method":"system.ping","params":{}}\n' \
            | cargo run -p michelangelo_cli -- core stdio

      - name: Smoke — project.create + get_snapshot
        run: |
          tmpdir=$(mktemp -d)
          printf '{"id":"c1","method":"project.create","params":{"path":"%s","name":"smoke"}}\n{"id":"c2","method":"project.get_snapshot","params":{}}\n' "$tmpdir" \
            | cargo run -p michelangelo_cli -- core stdio

      - name: Smoke — project.open + get_snapshot
        run: |
          tmpdir=$(mktemp -d)
          printf '{"id":"o1","method":"project.create","params":{"path":"%s","name":"open-smoke"}}\n{"id":"o2","method":"project.open","params":{"path":"%s"}}\n{"id":"o3","method":"project.get_snapshot","params":{}}\n' "$tmpdir" "$tmpdir" \
            | cargo run -p michelangelo_cli -- core stdio

      - name: Smoke — get_snapshot with no project (error)
        run: |
          printf '{"id":"e1","method":"project.get_snapshot","params":{}}\n' \
            | cargo run -p michelangelo_cli -- core stdio

  windows:
    name: Windows — Rust checks, Python worker checks, fake Blender smoke
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Real-Blender tests auto-skip on runners without a Blender installation.
      - name: Run tests
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build -p michelangelo_cli

      - name: Python worker syntax check
        run: python -m py_compile blender/worker.py scripts/test_worker_validation.py scripts/smoke_blender_scene.py

      - name: Python worker validation tests (no bpy)
        run: python scripts/test_worker_validation.py

      # Exercises the production Windows batch-wrapper path (`cmd /C call` on the
      # generated fake_blender.cmd) end to end through the CLI.
      - name: Acceptance smoke — fake Blender
        run: python scripts/smoke_blender_scene.py --fake

# BLOCKER (documented): GitHub-hosted runners do not ship Blender 5.x, so the real
# acceptance smoke (`python scripts/smoke_blender_scene.py`, calibrated silhouette)
# stays a local/manual check and is not part of CI. CI covers the deterministic
# fake mode plus every Rust/Python check; real-Blender tests auto-skip when the
# `blender` binary is absent (see docs/dev/DEVSTAND_WINDOWS.md).
