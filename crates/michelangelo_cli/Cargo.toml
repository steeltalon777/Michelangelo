[package]
name = "michelangelo_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "michelangelo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
michelangelo_core = { path = "../michelangelo_core" }
michelangelo_protocol = { path = "../michelangelo_protocol" }
