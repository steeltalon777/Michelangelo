[package]
name = "michelangelo_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "michelangelo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
michelangelo_core = { path = "../michelangelo_core" }
michelangelo_protocol = { path = "../michelangelo_protocol" }
michelangelo_input = { path = "../michelangelo_input" }
michelangelo_recon = { path = "../michelangelo_recon" }
michelangelo_edit = { path = "../michelangelo_edit" }
michelangelo_eval = { path = "../michelangelo_eval" }
michelangelo_evidence = { path = "../michelangelo_evidence" }
michelangelo_assistant = { path = "../michelangelo_assistant" }

[dev-dependencies]
tempfile = "3"
